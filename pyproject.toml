[project]
name = "ftre"
version = "0.2.6"
description = "ftre - AI 编程助手"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    # The official Cordis runtime is installed as the cordis-py distribution;
    # ftre intentionally does not ship a same-name fallback implementation.
    "cordis-py==0.4.0",
    "ftre-agent-core>=0.1.2",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "croniter>=2.0.0",
    "typer>=0.20.0,<1.0.0",
    "mcp>=1.0.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]
# 可选能力通过宿主 extras 表达，但不会把它们变成 ftre 的硬依赖。
# 两个发行物仍以自己的 entry point 注册 Plugin；未安装时 Host 不导入它们。
inbox = ["ftre-inbox>=0.1.0"]
compaction = ["ftre-compaction>=0.1.0"]
full = ["ftre-inbox>=0.1.0", "ftre-compaction>=0.1.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
ftre = "ftre.main:app"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
