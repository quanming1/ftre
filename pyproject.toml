[project]
name = "ftre"
version = "0.2.4"
description = "ftre - AI 编程助手"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    # The runtime is vendored below as a compatibility fallback for offline
    # development; installations with the reviewed cordis-py distribution use
    # the same public Context/Fiber/Service/Inject/Effect contract.
    "cordis-py>=0.4,<0.5",
    "ftre-agent-core>=0.1.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "croniter>=2.0.0",
    "typer>=0.20.0,<1.0.0",
    "mcp>=1.0.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
ftre = "ftre.main:app"

[tool.setuptools.packages.find]
where = ["src"]
