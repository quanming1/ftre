[project]
name = "ftre"
version = "0.3.0"
description = "ftre - AI 编程助手"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    # The official Cordis runtime is installed as the cordis-py distribution;
    # ftre intentionally does not ship a same-name fallback implementation.
    "cordis-py==0.4.0",
    "ftre-llm>=0.1.0,<0.2.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "croniter>=2.0.0",
    "typer>=0.20.0,<1.0.0",
    "mcp>=1.0.0,<2.0",
    # ftre 的默认发行组合：packages/ 下的每个独立 Package 都随 Host 安装。
    # Package 仍保留独立 entry point 和生命周期，安装合并不等于 Owner 合并。
    "ftre-inbox>=0.2.0,<0.3.0",
    "ftre-compaction>=0.2.0,<0.3.0",
    "ftre-agent>=0.1.0,<0.2.0",
    "ftre-agent-runtime>=0.1.0,<0.2.0",
    "ftre-messaging>=0.1.0,<0.2.0",
    "ftre-task>=0.1.0,<0.2.0",
    "ftre-team>=0.1.0,<0.2.0",
    "ftre-llm-recovery>=0.1.0,<0.2.0",
    "ftre-llm-fallback>=0.1.0,<0.2.0",
    "ftre-process>=0.1.0,<0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]
# 下面的 extras 保留按能力裁剪安装的兼容入口；默认安装已包含全部 Package。
agent = ["ftre-agent>=0.1.0,<0.2.0"]
agent-runtime = ["ftre-agent-runtime>=0.1.0,<0.2.0"]
inbox = ["ftre-inbox>=0.2.0,<0.3.0"]
messaging = ["ftre-messaging>=0.1.0,<0.2.0"]
task = ["ftre-task>=0.1.0,<0.2.0"]
team = ["ftre-team>=0.1.0,<0.2.0"]
llm-recovery = ["ftre-llm-recovery>=0.1.0,<0.2.0"]
llm-fallback = ["ftre-llm-fallback>=0.1.0,<0.2.0"]
llm = ["ftre-llm>=0.1.0,<0.2.0"]
compaction = ["ftre-compaction>=0.2.0,<0.3.0"]
process = ["ftre-process>=0.1.0,<0.2.0"]
full = [
    "ftre-llm>=0.1.0,<0.2.0",
    "ftre-inbox>=0.2.0,<0.3.0",
    "ftre-messaging>=0.1.0,<0.2.0",
    "ftre-task>=0.1.0,<0.2.0",
    "ftre-team>=0.1.0,<0.2.0",
    "ftre-compaction>=0.2.0,<0.3.0",
    "ftre-llm-recovery>=0.1.0,<0.2.0",
    "ftre-llm-fallback>=0.1.0,<0.2.0",
    "ftre-process>=0.1.0,<0.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
ftre = "ftre.main:app"

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "packages/ftre-agent/src",
    "packages/ftre-agent-runtime/src",
    "packages/ftre-inbox/src",
    "packages/ftre-compaction/src",
    "packages/ftre-messaging/src",
    "packages/ftre-task/src",
    "packages/ftre-team/src",
    "packages/ftre-llm-recovery/src",
    "packages/ftre-llm-fallback/src",
    "packages/ftre-llm/src",
    "packages/ftre-process/src",
]

[tool.setuptools.packages.find]
where = ["src"]
