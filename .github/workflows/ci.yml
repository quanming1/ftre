name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Checkout ftre-agent-core
        uses: actions/checkout@v4
        with:
          repository: quanming1/ftre-agent-core
          # B2 Responses 重放修复已合入 Core develop；用合入提交固定跨仓合同，
          # 避免 CI 使用旧 tag 漏测 status-free Item 重放。
          ref: 4a214f3e538023a0aa13dcc9b102281adc66609d
          path: ftre-agent-core

      - name: Checkout cordis-py
        uses: actions/checkout@v4
        with:
          repository: quanming1/cordis-py
          ref: v0.4.0
          path: cordis-py

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ./cordis-py
          pip install -e ./ftre-agent-core
          # ftre 默认依赖仓内七个 Package；先以 no-deps 方式注册本地发行物，
          # 避免 pip 在安装 Host 时去 PyPI 查找尚未发布的 monorepo Package。
          pip install -e ./packages/ftre-inbox --no-deps
          pip install -e ./packages/ftre-compaction --no-deps
          pip install -e ./packages/ftre-messaging --no-deps
          pip install -e ./packages/ftre-task --no-deps
          pip install -e ./packages/ftre-team --no-deps
          pip install -e ./packages/ftre-llm-recovery --no-deps
          pip install -e ./packages/ftre-llm-fallback --no-deps
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Syntax check
        run: |
          python -c "import ast, pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('src').rglob('*.py')]"

      - name: Run tests
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_octo_channel.py \
            --ignore=tests/test_plugin_tools.py \
            --ignore=tests/test_ws_volatile_replay.py \
            --ignore=tests/test_agent_manager.py \
            --ignore=tests/test_trace_store.py \
            --ignore=tests/test_mcp.py
