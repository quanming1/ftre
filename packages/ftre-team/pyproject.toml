[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftre-team"
version = "0.1.0"
description = "Multi-agent team collaboration Tool Plugin for ftre"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "ftre>=0.3.0,<0.4.0",
    "cordis-py==0.4.0",
    "ftre-agent-core>=0.2.0,<0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."ftre.plugins"]
team = "ftre_team.plugin:apply"
