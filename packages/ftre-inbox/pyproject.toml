[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftre-inbox"
version = "0.1.0"
description = "Optional durable two-lane Inbox package for ftre"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "ftre>=0.2.6",
    "cordis-py==0.4.0",
    "ftre-agent-core>=0.1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."ftre.plugins"]
inbox = "ftre_inbox.plugin:apply"
