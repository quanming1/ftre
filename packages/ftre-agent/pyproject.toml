[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftre-agent"
version = "0.1.0"
description = "Stable Agent service contracts for ftre (no runtime implementation)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "cordis-py==0.4.0",
    "ftre-agent-core>=0.2.0,<0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."ftre.plugins"]
agent-service = "ftre_agent.plugin:apply"
