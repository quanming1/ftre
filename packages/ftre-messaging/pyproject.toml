[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftre-messaging"
version = "0.1.0"
description = "Cross-session messaging Tool Plugin for ftre"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "ftre-agent>=0.1.0,<0.2.0",
    "ftre>=0.3.0,<0.4.0",
    "ftre-inbox>=0.2.0,<0.3.0",
    "cordis-py==0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."ftre.plugins"]
messaging = "ftre_messaging.plugin:apply"
