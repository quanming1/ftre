[project]
name = "ftre-compaction"
version = "0.2.0"
description = "Optional context compaction hooks and service for ftre"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ftre>=0.3.0,<0.4.0",
    "ftre-inbox>=0.2.0,<0.3.0",
    "cordis-py==0.4.0",
    "ftre-agent-core>=0.2.0,<0.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.entry-points."ftre.plugins"]
compaction = "ftre_compaction.plugin:apply"

[tool.setuptools.packages.find]
where = ["src"]
